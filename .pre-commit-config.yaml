# Pre-commit hooks for AIQE
# Run manually: pre-commit run --all-files
# Install: pre-commit install

default_language_version:
  python: python3.12

repos:
  # ==================================================
  # GENERAL FILE HYGIENE
  # ==================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: check-added-large-files
        name: Check for large files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
        name: Check for case conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: mixed-line-ending
        name: Mixed line endings
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        name: Prevent direct commits to main
        args: ["--branch", "main"]

  # ==================================================
  # SECURITY — SECRETS DETECTION
  # Must run before everything else
  # ==================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        name: Detect secrets and credentials

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets (backup scan)
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json

  # ==================================================
  # PYTHON — LINTING AND FORMATTING
  # ==================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        name: Ruff linter
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
        name: Ruff formatter

  # ==================================================
  # PYTHON — TYPE CHECKING
  # ==================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        name: MyPy type checker
        additional_dependencies:
          - pydantic>=2.7.0
          - types-pyyaml>=6.0.12
          - types-markdown>=3.6.0
        args: ["--config-file", "pyproject.toml"]

  # ==================================================
  # MARKDOWN
  # ==================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        name: Markdown linter
        args: ["--fix"]
