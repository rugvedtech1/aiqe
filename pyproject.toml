[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

# ==================================================
# PROJECT METADATA
# ==================================================

[project]
name = "aiqe"
version = "0.1.0-alpha"
description = "AI Quality Engineering Operating System — autonomous test strategy, generation, execution, and root-cause analysis with human-in-the-loop release decisions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "AIQE Contributors" }
]
keywords = [
    "ai",
    "quality-engineering",
    "test-automation",
    "qa",
    "testing",
    "release-intelligence",
    "playwright",
    "llm",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
requires-python = ">=3.12"

# ==================================================
# CORE DEPENDENCIES
# ==================================================

dependencies = [
    # CLI
    "typer[all]>=0.12.0",

    # Web framework (FastAPI server mode)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # HTTP client
    "httpx>=0.27.0",

    # Browser automation
    "playwright>=1.44.0",

    # Git operations
    "gitpython>=3.1.43",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",

    # AI providers
    "openai>=1.35.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
    "groq>=0.9.0",

    # Embeddings and vector search
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",

    # Configuration management
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # Reporting
    "jinja2>=3.1.4",
    "weasyprint>=62.0",
    "markdown>=3.6",

    # Notifications
    "slack-sdk>=3.29.0",

    # Security
    "cryptography>=42.0.0",
    "python-jose[cryptography]>=3.3.0",

    # Utilities
    "rich>=13.7.1",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "arrow>=1.3.0",
    "pyyaml>=6.0.1",
    "tomllib>=2.0.1; python_version < '3.11'",
]

# ==================================================
# OPTIONAL DEPENDENCY GROUPS
# ==================================================

[project.optional-dependencies]

# Development tools
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.8.0",
    "freezegun>=1.5.1",
    "respx>=0.21.0",
]

# Linting and formatting
lint = [
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-markdown>=3.6.0",
]

# Pre-commit hooks
hooks = [
    "pre-commit>=3.7.1",
]

# Documentation
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.27",
    "mkdocstrings[python]>=0.25.1",
]

# All development dependencies combined
all-dev = [
    "aiqe[dev,lint,hooks,docs]",
]

# ==================================================
# ENTRY POINTS (CLI commands)
# ==================================================

[project.scripts]
aiqe = "aiqe.cli.main:app"

# ==================================================
# BUILD CONFIGURATION
# ==================================================

[tool.hatch.build.targets.wheel]
packages = ["src/aiqe"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
]

# ==================================================
# PYTEST CONFIGURATION
# ==================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=src/aiqe",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (may use database or filesystem)",
    "e2e: End-to-end tests (require full environment)",
    "security: Security-focused tests",
    "performance: Performance and load tests",
    "slow: Tests that take more than 5 seconds",
    "browser: Tests that require a browser (Playwright)",
    "llm: Tests that require a real LLM provider (use sparingly)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:google",
]

# ==================================================
# RUFF CONFIGURATION (linting + formatting)
# ==================================================

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "S",    # flake8-bandit (security)
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
    "ANN",  # flake8-annotations (type hints enforced)
    "D",    # pydocstyle (docstrings enforced)
]
ignore = [
    "D100",  # Missing docstring in public module (handled at package level)
    "D104",  # Missing docstring in public package
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert is fine in tests
    "ANN",    # type annotations not required in tests
    "D",      # docstrings not required in tests
    "ARG",    # unused arguments are common in fixtures
]
"scripts/**/*.py" = [
    "D",
    "ANN",
]

[tool.ruff.lint.isort]
known-first-party = ["aiqe"]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# ==================================================
# MYPY CONFIGURATION (static type checking)
# ==================================================

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true
exclude = [
    "tests/",
    "scripts/",
    "docs/",
]

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "weasyprint.*",
    "playwright.*",
    "git.*",
]
ignore_missing_imports = true

# ==================================================
# COVERAGE CONFIGURATION
# ==================================================

[tool.coverage.run]
source = ["src/aiqe"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
